[workspace]
members = ["core", "app"]
# The app is browser-only. Trunk builds it, so plain cargo commands skip it.
default-members = [".", "core"]

[package]
name = "keygen"
version = "0.1.0"
edition = "2024"
authors = ["Xuming Zeng <xsznix@gmail.com>"]

[dependencies]
keygen-core = { path = "core" }
rand = "0.10.3"
getopts = "0.2.24"
rayon = "1.12.0"

[profile.dev]
opt-level = 3
debug = true
