[package]
name = "keygen-app"
version = "0.1.0"
edition = "2024"

[dependencies]
keygen-core = { path = "../core" }
console_error_panic_hook = "0.1.7"
# rand needs a browser random source on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http"] }
leptos = { version = "0.9.0-rc0", features = ["csr"] }
