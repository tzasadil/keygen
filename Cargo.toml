[workspace]
# The 2015-edition root would default to resolver 1. That enables features of
# target-specific deps even when the target does not match, which turns on
# leptos_macro's erase_components code without the leptos side.
resolver = "2"
members = ["core", "app"]
# The app is browser-only. Trunk builds it, so plain cargo commands skip it.
default-members = [".", "core"]

[package]
name = "keygen"
version = "0.1.0"
authors = ["Xuming Zeng <xsznix@gmail.com>"]

[dependencies]
keygen-core = { path = "core" }
rand = "0.7.3"
getopts = "0.2.21"
rayon = "1.3.1"
num_cpus = "1.13.0"

[profile.dev]
opt-level = 3
debug = true
